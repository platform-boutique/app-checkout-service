# Local guard that runs the same checks as CI. One-time setup per clone:  pipx install pre-commit && pre-commit install
# - every commit: gitleaks scans the staged changes, private-key / large-file checks, gofmt
# - every push:   gitleaks scans the commits being pushed, golangci-lint
# Format and lint use the same tools and pinned versions as the shared CI workflow (platform-demo-workflows), so a clean
# local run means the `Lint & Format` job passes. This is a fast local guard (git push --no-verify skips it); the CI jobs,
# GitHub push protection and the CI secret scan are the enforcing layers.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (as CI)
        language: system
        types: [go]
        pass_filenames: false
        entry: bash -c 'out=$(gofmt -l -e .); if [ -n "$out" ]; then echo "These files are not formatted:"; echo "$out"; exit 1; fi'
        stages: [pre-commit]
      - id: golangci-lint
        name: golangci-lint v2.14.0 (as CI)
        language: golang
        # keep the version equal to the one in platform-demo-workflows (service-ci-go.yaml)
        additional_dependencies: [github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0]
        entry: golangci-lint run
        types: [go]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      - id: gitleaks-push
        name: gitleaks (commits being pushed)
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        # pre-commit exports the pushed range; without it (e.g. a brand-new branch) the whole history is scanned
        entry: bash -c 'range=""; if [ -n "${PRE_COMMIT_FROM_REF:-}" ] && [ -n "${PRE_COMMIT_TO_REF:-}" ]; then range="${PRE_COMMIT_FROM_REF}..${PRE_COMMIT_TO_REF}"; fi; gitleaks git --redact --verbose ${range:+--log-opts="$range"}' --
        pass_filenames: false
        always_run: true
        stages: [pre-push]
